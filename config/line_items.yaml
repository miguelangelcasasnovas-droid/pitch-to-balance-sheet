# Partidas originales de ingresos de cada club y concepto al que va cada una (fase 3a).
#
# Conceptos: revenue_matchday, revenue_broadcasting, revenue_commercial y revenue_other, o
# player_trading para los traspasos y cesiones que el club mete en sus ingresos (se restan para
# revenue_ex_player_trading, sección 9 del plan).
#
# Criterio único, el de la Deloitte Football Money League (decisión del usuario del 27/09/2026,
# sección 9 del plan):
# - matchday: entradas, abonos y hospitality de partido;
# - broadcasting: derechos audiovisuales y premios de competiciones (UEFA y FIFA);
# - commercial: patrocinio, merchandising, retail, licencias, y conferencias o catering fuera de
#   partido;
# - other: solo lo que no es fútbol (inmuebles y similares), lo mínimo posible.
# Cuando la agrupación del propio club choca con este criterio, manda el criterio, y el motivo de
# la partida lo anota. Un concepto al que no va ninguna partida vale 0, derivado, si las
# partidas suman exactamente el total; solo es hueco si el club no publica desglose.
# Una partida que no se puede clasificar sin decidir es dudosa: concept: null y sus candidatos;
# sus conceptos candidatos quedan como hueco hasta que decida el usuario. Ahora no hay ninguna.
#
# Cada partida dice qué celda de la especificación del club la lee (cell: tabla.fila, en
# src/pitch_to_balance_sheet/extract/clubs/<club>.py) y en qué columna. total es el total
# publicado que suman todas las partidas, traspasos incluidos: si una fila de ingresos se queda
# sin partida, ese cuadre no pasa y la build se rompe.
"2024/25":
  manchester_city:
    source: nota 4, pág. 35
    column: "2025"
    total: revenue.total
    items:
      matchday:
        cell: revenue.matchday
        label: Matchday
        concept: revenue_matchday
        reason: Partida matchday del club.
      broadcasting_uefa:
        cell: revenue.broadcasting_uefa
        label: Broadcasting - UEFA
        concept: revenue_broadcasting
        reason: Premios UEFA, en broadcasting (sección 9 del plan).
      broadcasting_other:
        cell: revenue.broadcasting_other
        label: Broadcasting - all other
        concept: revenue_broadcasting
        reason: Partida broadcasting del club.
      other_commercial:
        cell: revenue.other_commercial
        label: Other commercial activities
        concept: revenue_commercial
        reason: >-
          Commercial (criterio; era dudosa, decidida por el usuario). La nota dice que los
          ingresos tienen tres componentes principales: matchday, broadcasting y commercial.
          Incluye el neto de la tienda externalizada (+61,8 millones si no lo estuviera).
