    price_currency: EUR
    price_primary: false
    price_source: https://www.inter.it/it/notizie/comunicazione-societaria-23-05-2024
    price_text: ejecución de la prenda sobre las acciones de la holding de control
    reason: >-
      ejecución de un préstamo impagado (~395 M€ según ANSA), no una venta: no hay precio de
      mercado
    variants: []
