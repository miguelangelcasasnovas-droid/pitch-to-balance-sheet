# Fuente de cada club y temporada. Decisiones del usuario del 26/09/2026 (docs/estado.md);
# URLs comprobadas el 26/09/2026 en docs/fuentes-pendientes.md.
#
# primary: de ahí salen las cifras. controls: sirven para contrastarlas.
# kind:
#   companies_house: cuentas depositadas, por la API (python -m pitch_to_balance_sheet download).
#   url: archivo de la web (un PDF, o un ZIP ESEF como el de Lazio); su robots.txt permite la
#        descarga automática (python -m pitch_to_balance_sheet download-web). Se guarda en
#        data/raw/<file>.
#   manual: PDF descargado a mano a data/raw/<file>. Se registra en data/raw/manifest.csv
#           (python -m pitch_to_balance_sheet register-manual) y el pipeline comprueba su sha256:
#           si falta el archivo o ha cambiado, sale con error.
# Las páginas de cada cifra están en el extractor de cada club (src/pitch_to_balance_sheet/extract/clubs/).
#
# Manchester United, Dortmund, Ajax y Benfica: decisión del usuario del 27/09/2026, con las URLs
# de docs/plan.md, sección 6. El robots.txt de cada dominio se comprueba al descargar.
# Lazio y FC Porto: decisión del usuario del 27/09/2026, con las fuentes localizadas en
# docs/fuentes-pendientes.md, sección 6.
"2024/25":
  arsenal:
    # Si aparece data/raw/manual/arsenal_2024-25.pdf, pasa a ser la fuente principal.
    # El 26/09/2026 no existe: la fuente es Companies House.
    primary:
      kind: companies_house
  chelsea:
    primary:
      kind: companies_house
  liverpool:
    primary:
      kind: url
      url: https://backend.liverpoolfc.com/sites/default/files/2026-03/2025_Accounts_0b9cd179492e0f16a4de8edfc027212f.pdf
      file: web/liverpool_2024-25.pdf
      note: Sin capa de texto, pero es un render limpio, no un escaneo. Necesita OCR.
    controls:
      - kind: companies_house
  manchester_city:
    primary:
      kind: manual
      file: manual/mancity_2024-25.pdf
      url: https://www.mancity.com/annualreport2025/wp-content/uploads/2025/11/mcfc_financial_report_2025_.pdf
      note: Cloudflare devuelve 403 a la descarga automática. Descargado a mano por el usuario.
    controls:
      - kind: companies_house
  tottenham:
    primary:
      kind: companies_house
  newcastle:
    primary:
      kind: companies_house
  juventus:
    primary:
      kind: url
      url: https://www.juventus.com/images/image/private/fl_attachment/dev/e0wkkhbyscbvklpjx5kg.pdf
      file: web/juventus_2024-25_it.pdf
      note: Relazione Finanziaria Annuale al 30 giugno 2025, en italiano, la versión que prevalece.
    controls:
      - kind: url
        url: https://www.juventus.com/images/image/private/fl_attachment/dev/kxj334yxgnpmidayi3wp.pdf
        file: web/juventus_2024-25_en.pdf
        note: Traducción al inglés. Su portada avisa de que prevalece la italiana.
  celtic:
    primary:
      kind: url
      url: https://cdn.celticfc.com/assets/Celtic_plc_Annual_Report_2025.pdf
      file: web/celtic_2024-25.pdf
  manchester_united:
    # Decisión del usuario del 27/09/2026: el 20-F del ejercicio 2024/25 es la fuente, y el de
    # 2025/26 es el control de reexpresión (sección 5 del plan: se marca si difiere más de un 1%).
    primary:
      kind: url
      url: https://ir.manutd.com/~/media/Files/M/Manutd-IR/documents/2025-mu-plc-form-20-f.pdf
      file: web/manchester_united_20-f_2025.pdf
      note: Form 20-F del ejercicio 2024/25, enlazado en ir.manutd.com/financial-information/annual-reports/2025.aspx. Cotiza en USD e informa en GBP.
    controls:
      - kind: url
        url: https://ir.manutd.com/~/media/Files/M/Manutd-IR/documents/2026-mu-plc-form-20-f.pdf
        file: web/manchester_united_20-f_2026.pdf
        note: Form 20-F del ejercicio 2025/26; su columna 2025 es el control de reexpresión.
  borussia_dortmund:
    # Decisión del usuario del 27/09/2026: el informe en alemán (vinculante) es la fuente y el
    # inglés, el control. El PDF alemán no tiene URL pública localizable: la página de informes
    # carga la lista desde una API con token. Hay que descargarlo a mano.
    primary:
      kind: manual
      file: manual/borussia_dortmund_2024-25_de.pdf
      url: https://aktie.bvb.de/publikationen/geschaftsberichte
      note: Geschäftsbericht 2024/2025 en alemán, descargado a mano de la página de informes del club.
    controls:
      - kind: url
        url: https://aktie.bvb.de/media/document/9eb897d3-91ac-48fa-a7b7-f0ed7eba1aff/assets/DE0005493092-JA-2024-EQ-E-00.pdf?disposition=inline
        file: web/borussia_dortmund_2024-25_en.pdf
        note: Informe anual 2024/25 en inglés; cuentas IFRS de grupo, no las HGB.
  ajax:
    primary:
      kind: url
      url: https://www.ajax.nl/media/4tyefgaj/ajax-jaarverslag-2024_2025.pdf
      file: web/ajax_2024-25.pdf
      note: Jaarverslag 2024/25, en neerlandés.
  benfica:
    primary:
      kind: url
      url: https://media.slbenfica.pt/-/media/BenficaDP/Images/Instituicao/SAD/prestacao-de-contas/anuais/20251001-relatorio-contas-24-25
      file: web/benfica_2024-25.pdf
      note: Relatório e Contas 2024/25, en portugués.
  lazio:
    primary:
      kind: url
      url: https://www.1info.it/PdfViewer/PdfShow.aspx?service=&type=documenti&year=2025&file=159386_oneinfo.zip&download=1
      file: web/lazio_2024-25_esef.zip
      note: >-
        Relazione finanziaria annuale separata e consolidata al 30.06.2025, paquete ESEF (XHTML con
        iXBRL) del portal 1info, protocolo 159386_oneinfo. Se usan las cuentas consolidadas.
  porto:
    primary:
      kind: manual
      file: manual/porto_2024-25.pdf
      url: https://www.cmvm.pt/PInstitucional/PdfViewerInfPriv?Input=EBA43BC8F4EB22A844F75CC1AC19DCE1954A814A216A036952C6F2AD11B1DA92
      note: >-
        Relatório Anual Integrado 2024/2025, versão não ESEF, descargado a mano del visor de la
        CMVM. Se usan las cuentas consolidadas. El ESEF no se ha podido descargar: queda fuera.
    controls:
      - kind: url
        url: https://transparencia.fcporto.pt/assets/uploads/financeira/ComunicadoDivulgacaoResultados20242025.pdf
        file: web/porto_comunicado_2024-25.pdf
        note: >-
          Comunicado de resultados 2024/25 del portal de transparencia. Las cifras que trae tienen
          que coincidir; las que no trae quedan sin control.
