# Fuente de cada club y temporada. Decisiones del usuario del 26/09/2026 (docs/estado.md);
# URLs comprobadas el 26/09/2026 en docs/fuentes-pendientes.md.
#
# primary: de ahí salen las cifras. controls: sirven para contrastarlas.
# kind:
#   companies_house: cuentas depositadas, por la API (python -m pitch_to_balance_sheet download).
#   url: PDF de la web del club; su robots.txt permite la descarga automática.
#   manual: PDF descargado a mano a data/raw/<file>. Se registra en data/raw/manifest.csv
#           (python -m pitch_to_balance_sheet register-manual) y el pipeline comprueba su sha256:
#           si falta el archivo o ha cambiado, sale con error.
# pages: páginas del PDF (desde 1) localizadas a mano mirando la página renderizada.
#
# Lazio y FC Porto: pendientes (docs/estado.md), sin fuente fijada.
"2024/25":
  arsenal:
    # Si aparece data/raw/manual/arsenal_2024-25.pdf, pasa a ser la fuente principal.
    # El 26/09/2026 no existe: la fuente es Companies House.
    primary:
      kind: companies_house
  chelsea:
    primary:
      kind: companies_house
      pages:
        income_statement: 17  # Group profit and loss account (pág. 14 impresa)
        staff_costs_note: 34  # Nota 8, Employees: remuneración agregada (pág. 31 impresa)
  liverpool:
    primary:
      kind: url
      url: https://backend.liverpoolfc.com/sites/default/files/2026-03/2025_Accounts_0b9cd179492e0f16a4de8edfc027212f.pdf
      note: Sin capa de texto, pero es un render limpio, no un escaneo. Necesita OCR.
    controls:
      - kind: companies_house
  manchester_city:
    primary:
      kind: manual
      file: manual/mancity_2024-25.pdf
      url: https://www.mancity.com/annualreport2025/wp-content/uploads/2025/11/mcfc_financial_report_2025_.pdf
      note: Cloudflare devuelve 403 a la descarga automática. Descargado a mano por el usuario.
    controls:
      - kind: companies_house
  tottenham:
    primary:
      kind: companies_house
  newcastle:
    primary:
      kind: companies_house
  juventus:
    primary:
      kind: url
      url: https://www.juventus.com/images/image/private/fl_attachment/dev/e0wkkhbyscbvklpjx5kg.pdf
      note: Relazione Finanziaria Annuale al 30 giugno 2025, en italiano, la versión que prevalece.
    controls:
      - kind: url
        url: https://www.juventus.com/images/image/private/fl_attachment/dev/kxj334yxgnpmidayi3wp.pdf
        note: Traducción al inglés. Su portada avisa de que prevalece la italiana.
  celtic:
    primary:
      kind: url
      url: https://cdn.celticfc.com/assets/Celtic_plc_Annual_Report_2025.pdf
