# Clubes del universo. Fuente: docs/plan.md, sección 7.1, con las fichas de Companies House
# consultadas el 25/09/2026 (https://find-and-update.company-information.service.gov.uk/company/<número>).
#
# fiscal_year_end: día y mes de cierre (MM-DD). La temporada es el año fiscal que cierra en ella:
# un cierre a 31/05/2025 o a 30/06/2025 es la temporada 2024/25.
# framework: marco contable de las cuentas usadas, con la página donde lo dice el informe. En FRS
# 102 los arrendamientos operativos no van al balance (sección 9 del plan).
# ticker, exchange, quote_currency y quote_divisor: los cotizados (plan, sección 6). El precio de
# cada uno se toma a mano de su bolsa (config/market.yaml) y tiene que venir en quote_currency.
clubs:
  - club_id: arsenal
    name: Arsenal
    entity: Arsenal Holdings Limited
    companies_house_number: "04250459"
    fiscal_year_end: "05-31"
    framework: "FRS 102"  # Companies House, pág. 27 (nota 1)
  - club_id: chelsea
    name: Chelsea
    entity: Chelsea FC Holdings Limited
    companies_house_number: "02536231"
    fiscal_year_end: "06-30"
