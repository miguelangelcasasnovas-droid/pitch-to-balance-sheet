[project]
name = "pitch-to-balance-sheet"
version = "0.1.0"
description = "Cuentas de clubes de fútbol europeos en una sola tabla, con métricas de sostenibilidad y valoración por múltiplos."
requires-python = ">=3.11"
# Versiones fijadas según docs/plan.md, sección 11.
dependencies = [
    "duckdb==1.5.5",
    "pandas==3.0.6",
    "pandera==0.33.1",
    "pdfplumber==0.11.10",
    "plotly==7.1.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "streamlit==1.64.0",
    "yfinance==0.2.66",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["uv_build==0.11.24"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".cache/uv"

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
# Excluidas aquí y no solo en .gitignore: ruff solo lee .gitignore dentro de un repo git.
extend-exclude = [".cache", ".tools", ".venv-linux", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = ["--strict-markers"]
