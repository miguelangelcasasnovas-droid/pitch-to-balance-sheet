# Hooks locales: pre-commit no descarga ni compila nada, y nada se escribe fuera del proyecto.
# - gitleaks: binario fijado en .tools/, instalado por scripts/install-hooks.sh (sha256 comprobado).
# - ruff: el de .venv, con la versión fijada en pyproject.toml.
# La caché de pre-commit va en .cache/pre-commit: el hook exporta PRE_COMMIT_HOME.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secretos en lo que se va a commitear)
        entry: .tools/gitleaks git --pre-commit --redact --staged --verbose
        language: unsupported
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
